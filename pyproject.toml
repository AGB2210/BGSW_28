[project]
name = "oncall-agent"
version = "0.1.0"
description = "AI on-call engineer for the OpenTelemetry Demo (Incident Zero hackathon)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
oncall = "oncall.__main__:main"
faultctl = "faultctl.__main__:main"
action-api = "actionapi.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
